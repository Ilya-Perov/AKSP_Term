version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: house_tasks_postgres
    environment:
      POSTGRES_USER: house_tasks_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: house_tasks
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U house_tasks_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - house_tasks_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: house_tasks_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - house_tasks_network

  redis:
    image: redis:7-alpine
    container_name: house_tasks_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - house_tasks_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: house_tasks_backend
    environment:
      DATABASE_URL: postgresql://house_tasks_user:secure_password_123@postgres:5432/house_tasks
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    networks:
      - house_tasks_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: house_tasks_frontend
    environment:
      REACT_APP_API_URL: http://213.171.30.203:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    networks:
      - house_tasks_network
    command: npm start

volumes:
  postgres_data:
  redis_data:

networks:
  house_tasks_network:
    driver: bridge
